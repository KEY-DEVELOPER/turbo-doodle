[project]
name = "edgeledger"
version = "0.1.0"
description = "EdgeLedger backend: football +EV research, decision-support and tracking (modular monolith)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/*.pyc"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "DTZ", "SIM", "RUF", "PL", "T20", "ERA",
]
ignore = [
    "PLR0913",  # SQLAlchemy/Pydantic constructors legitimately take many args
    "PLR2004",  # magic values are fine in tests and domain constants
    "S101",     # assert is used by pytest
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "T20"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["importlinter.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../tools"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs PostgreSQL (EDGELEDGER_TEST_DATABASE_URL); skipped when unreachable unless EDGELEDGER_REQUIRE_DB=1",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
